name: Deploy DJ MXNISH site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Force real photo asset
        run: |
          sed -i 's#assets/dj-mxnish-logo.jpg?v=4#assets/dj-mxnish-real.svg#g' index.html
          sed -i 's#assets/dj-mxnish-gallery-data.txt?v=4#assets/dj-mxnish-real.svg#g' index.html
          sed -i 's#assets/dj-mxnish-logo-new.jpg#assets/dj-mxnish-real.svg#g' index.html
          sed -i 's#assets/dj-mxnish-showcase-new.jpg#assets/dj-mxnish-real.svg#g' index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
