name: Deploy DJ MXNISH site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fix DJ photo URLs
        run: |
          sed -i 's#assets/dj-mxnish-real.svg?v=4#assets/dj-mxnish-gallery.webp?v=6#g' index.html
          sed -i 's#assets/dj-mxnish-real.svg?v=2#assets/dj-mxnish-gallery.webp?v=6#g' index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
