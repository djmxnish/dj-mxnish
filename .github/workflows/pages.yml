name: Deploy DJ MXNISH site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore photo assets
        run: |
          set -e
          base64 -d assets/dj-mxnish-about.webp.b64 > assets/dj-mxnish-about.webp
          base64 -d assets/dj-mxnish-live.b64 > assets/dj-mxnish-live.webp
          file assets/dj-mxnish-about.webp assets/dj-mxnish-live.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          script = '''<script>
document.addEventListener('DOMContentLoaded', function(){
  const photos = document.querySelectorAll('.media-card img');
  const sources = ['assets/dj-mxnish-about.webp','assets/dj-mxnish-live.webp'];
  photos.forEach(function(img, i){
    if (sources[i]) img.src = sources[i];
    img.addEventListener('error', function(){
      const card = img.closest('.media-card');
      if (card) card.classList.add('media-failed');
      img.style.display = 'none';
    }, {once:true});
  });
});
</script>'''
          if 'dj-mxnish-about.webp' not in html.split('</body>')[0]:
              html = html.replace('</body>', script + '\\n</body>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
